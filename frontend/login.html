<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login - ExpenseTrack</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <a href="index.html" class="auth-brand">
        <div class="landing-brand-icon me-2">
          <i class="bi bi-wallet2"></i>
        </div>
        <span>ExpenseTrack</span>
      </a>
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Sign in to manage your finances and expenses</p>

      <!-- Alert for error messages -->
      <div id="loginErrorAlert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

      <form id="loginForm" novalidate>
        <!-- Email / Username Input -->
        <div class="mb-3">
          <label for="email" class="form-label small fw-semibold">Username or Email</label>
          <div class="input-group">
            <span class="input-group-text border-end-0">
              <i class="bi bi-person"></i>
            </span>
            <input type="text" class="form-control border-start-0" id="email" placeholder="admin or email address" required autocomplete="username">
          </div>
        </div>

        <!-- Password Input -->
        <div class="mb-3">
          <div class="d-flex justify-content-between">
            <label for="password" class="form-label small fw-semibold">Password</label>
          </div>
          <div class="input-group">
            <span class="input-group-text border-end-0">
              <i class="bi bi-lock"></i>
            </span>
            <input type="password" class="form-control border-start-0 border-end-0" id="password" placeholder="Enter password" required autocomplete="current-password">
            <button class="btn btn-navy-outline border-start-0 toggle-password" type="button" data-target="password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="mb-4 form-check">
          <input type="checkbox" class="form-check-input" id="rememberMe">
          <label class="form-check-label small" for="rememberMe">Keep me logged in</label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-mint w-100 py-2 mb-3" id="btnLoginSubmit">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>

        <p class="text-center small mb-0">
          Don't have an account yet? 
          <a href="register.html" class="fw-semibold text-decoration-none" style="color: #00f5a0 !important;">Create Account</a>
        </p>
      </form>
    </div>
  </div>

  <div id="toastContainer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initLoginPage();
    });
  </script>
</body>
</html>
