<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration - ExpenseTrack</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <a href="index.html" class="auth-brand">
        <div class="landing-brand-icon me-2">
          <i class="bi bi-wallet2"></i>
        </div>
        <span>ExpenseTrack</span>
      </a>
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-subtitle">Start tracking and optimizing your personal budget</p>

      <!-- Alert for error messages -->
      <div id="registerErrorAlert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

      <form id="registerForm" novalidate>
        <!-- Full Name -->
        <div class="mb-3">
          <label for="name" class="form-label small fw-semibold">Full Name</label>
          <div class="input-group">
            <span class="input-group-text border-end-0">
              <i class="bi bi-person"></i>
            </span>
            <input type="text" class="form-control border-start-0" id="name" placeholder="John Doe" required autocomplete="name">
          </div>
        </div>

        <!-- Email Address -->
        <div class="mb-3">
          <label for="email" class="form-label small fw-semibold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text border-end-0">
              <i class="bi bi-envelope"></i>
            </span>
            <input type="email" class="form-control border-start-0" id="email" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <!-- Preferred Currency -->
        <div class="mb-3">
          <label for="currency" class="form-label small fw-semibold">Preferred Currency Symbol</label>
          <div class="input-group">
            <span class="input-group-text border-end-0">
              <i class="bi bi-cash-stack"></i>
            </span>
            <select class="form-select border-start-0" id="currency">
              <option value="₹" selected>₹ - Indian Rupee (INR)</option>
              <option value="$">$ - US Dollar (USD)</option>
              <option value="€">€ - Euro (EUR)</option>
              <option value="£">£ - British Pound (GBP)</option>
            </select>
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label small fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text border-end-0">
              <i class="bi bi-lock"></i>
            </span>
            <input type="password" class="form-control border-start-0 border-end-0" id="password" placeholder="Min 6 characters" required autocomplete="new-password">
            <button class="btn btn-navy-outline border-start-0 toggle-password" type="button" data-target="password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="mb-3">
          <label for="confirmPassword" class="form-label small fw-semibold">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text border-end-0">
              <i class="bi bi-shield-check"></i>
            </span>
            <input type="password" class="form-control border-start-0 border-end-0" id="confirmPassword" placeholder="Repeat password" required autocomplete="new-password">
            <button class="btn btn-navy-outline border-start-0 toggle-password" type="button" data-target="confirmPassword">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <!-- Terms Agreement -->
        <div class="mb-4 form-check">
          <input type="checkbox" class="form-check-input" id="termsCheck" required checked>
          <label class="form-check-label small" for="termsCheck">
            I agree to the Terms of Service & Privacy Policy
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-mint w-100 py-2 mb-3" id="btnRegisterSubmit">
          <i class="bi bi-person-plus me-2"></i>Create Account
        </button>

        <p class="text-center small mb-0">
          Already have an account? 
          <a href="login.html" class="fw-semibold text-decoration-none" style="color: #00f5a0 !important;">Sign In</a>
        </p>
      </form>
    </div>
  </div>

  <div id="toastContainer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initRegisterPage();
    });
  </script>
</body>
</html>
