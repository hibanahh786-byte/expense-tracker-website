<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Expense - ExpenseTracker</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <a href="index.html" class="sidebar-brand text-decoration-none">
        <i class="bi bi-wallet2"></i>
        <span>ExpenseTrack</span>
      </a>

      <ul class="sidebar-menu">
        <li class="sidebar-menu-item">
          <a href="dashboard.html" class="sidebar-link">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="add-expense.html" class="sidebar-link">
            <i class="bi bi-plus-circle"></i>
            <span>Add Expense</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="expenses.html" class="sidebar-link active">
            <i class="bi bi-receipt-cutoff"></i>
            <span>View All Expenses</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="reports.html" class="sidebar-link">
            <i class="bi bi-graph-up-arrow"></i>
            <span>Monthly Reports</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="profile.html" class="sidebar-link">
            <i class="bi bi-person-gear"></i>
            <span>User Profile</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="admin.html" class="sidebar-link">
            <i class="bi bi-shield-lock"></i>
            <span>Admin Control</span>
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <div class="user-badge">
          <div class="user-avatar dynamic-user-avatar">U</div>
          <div class="user-details">
            <div class="user-name dynamic-user-name">User Name</div>
            <div class="user-email dynamic-user-email">user@example.com</div>
          </div>
        </div>
        <a href="#" class="text-secondary hover-white ms-2 btn-logout" title="Sign Out">
          <i class="bi bi-box-arrow-right fs-5"></i>
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="top-header">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-navy-outline d-lg-none py-1 px-2" id="sidebarToggle" aria-label="Toggle Sidebar">
            <i class="bi bi-list fs-5"></i>
          </button>
          <div>
            <h5 class="mb-0 fw-bold">Edit Expense Record</h5>
            <small>Modify transaction values below</small>
          </div>
        </div>

        <div>
          <a href="expenses.html" class="btn btn-navy-outline">
            <i class="bi bi-arrow-left me-1"></i> Cancel & Return
          </a>
        </div>
      </header>

      <div class="page-body">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="dashboard-card">
              <div class="card-header">
                <h6 class="card-title-custom">
                  <i class="bi bi-pencil text-primary"></i>
                  <span>Update Expense Data</span>
                </h6>
                <span class="text-muted small">* Required</span>
              </div>
              <div class="card-body p-4">
                <form id="editExpenseForm" novalidate>
                  <input type="hidden" id="editExpenseId">

                  <!-- Title -->
                  <div class="mb-3">
                    <label for="editExpenseTitle" class="form-label small fw-semibold">Expense Title *</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-type"></i></span>
                      <input type="text" class="form-control" id="editExpenseTitle" required maxlength="100">
                    </div>
                  </div>

                  <!-- Amount & Category -->
                  <div class="row g-3 mb-3">
                    <div class="col-md-6">
                      <label for="editExpenseAmount" class="form-label small fw-semibold">Amount *</label>
                      <div class="input-group">
                        <span class="input-group-text fw-bold dynamic-user-currency">₹</span>
                        <input type="number" step="0.01" min="0.01" class="form-control" id="editExpenseAmount" required>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <label for="editExpenseCategory" class="form-label small fw-semibold">Category *</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-tags"></i></span>
                        <select class="form-select" id="editExpenseCategory" required>
                          <option value="Food">Food</option>
                          <option value="Travel">Travel</option>
                          <option value="Shopping">Shopping</option>
                          <option value="Education">Education</option>
                          <option value="Health">Health</option>
                          <option value="Entertainment">Entertainment</option>
                          <option value="Bills">Bills</option>
                          <option value="Others">Others</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  <!-- Date & Payment Method -->
                  <div class="row g-3 mb-3">
                    <div class="col-md-6">
                      <label for="editExpenseDate" class="form-label small fw-semibold">Date *</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
                        <input type="date" class="form-control" id="editExpenseDate" required>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <label for="editExpensePayment" class="form-label small fw-semibold">Payment Method</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-credit-card-2-front"></i></span>
                        <select class="form-select" id="editExpensePayment">
                          <option value="Cash">Cash</option>
                          <option value="Credit Card">Credit Card</option>
                          <option value="Debit Card">Debit Card</option>
                          <option value="UPI">UPI</option>
                          <option value="Net Banking">Net Banking</option>
                          <option value="Other">Other</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  <!-- Description -->
                  <div class="mb-4">
                    <label for="editExpenseDescription" class="form-label small fw-semibold">Description / Notes</label>
                    <textarea class="form-control" id="editExpenseDescription" rows="3" maxlength="500"></textarea>
                  </div>

                  <!-- Actions -->
                  <div class="d-flex align-items-center justify-content-end gap-2 pt-3 border-top">
                    <a href="expenses.html" class="btn btn-outline-custom">Cancel</a>
                    <button type="submit" class="btn btn-primary-custom px-4" id="btnUpdateExpense">
                      <i class="bi bi-save me-1"></i> Update Expense
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toastContainer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/expenses.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initEditExpensePage();
    });
  </script>
</body>
</html>
